<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>校园活动与机会 · 功能预览</title>
  <style>
    :root{color-scheme:light;--bg:#f5f4ef;--paper:#fffefa;--ink:#202925;--muted:#718079;--green:#294c40;--green-soft:#e8eee9;--orange:#c56e4d;--line:#e8e4da;--shadow:0 12px 36px #253d3010;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer}.demo-banner{background:#fff5e9;border-bottom:1px solid #ecd9c4;color:#765640;text-align:center;padding:8px 16px;font-size:13px}.header{position:sticky;top:0;z-index:5;background:#f8f7f2ed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.header-inner{max-width:1160px;margin:auto;min-height:76px;padding:12px 22px;display:flex;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:12px;min-width:230px}.brand-icon{width:44px;height:44px;border-radius:16px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px;font-weight:750}.brand strong{display:block;font-size:16px}.brand small{color:var(--muted);font-size:10px;letter-spacing:1.4px}.nav{display:flex;align-items:center;justify-content:center;gap:4px;flex:1}.nav button{border:0;background:transparent;color:#68736d;border-radius:14px;padding:10px 12px;white-space:nowrap;transition:.2s}.nav button:hover,.nav button.active{background:var(--green-soft);color:var(--green)}.nav button.active{font-weight:650}.publish-top,.primary{border:0;border-radius:999px;background:var(--green);color:white;padding:12px 18px;font-weight:650;box-shadow:0 5px 14px #203b3020;transition:transform .2s,background .2s}.publish-top:hover,.primary:hover{background:#1c3a30;transform:translateY(-1px)}main{max-width:1160px;margin:26px auto 70px;padding:0 22px;animation:enter .35s ease}@keyframes enter{from{opacity:.35;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}.demo-note{padding:13px 17px;border:1px solid #e8dacb;background:#fbf5ee;border-radius:18px;color:#806349;font-size:13px;margin-bottom:22px}.hero{background:var(--green-soft);border-radius:34px;min-height:270px;padding:38px 42px;display:grid;grid-template-columns:1.4fr .8fr;align-items:center;gap:20px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:380px;height:380px;border:1px solid #cbd7cf;border-radius:50%;right:10%;top:-180px;box-shadow:0 0 0 42px #e7ede8,0 0 0 43px #cbd7cf,0 0 0 92px #e7ede8,0 0 0 93px #cbd7cf;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:2px;color:#668074;font-weight:750}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:12px 0 14px;letter-spacing:-1.5px}.hero h1 span{color:var(--orange)}.hero p{color:#63756c;max-width:570px;margin:0}.hero-side{z-index:1;justify-self:end;min-width:210px}.stat-row{display:flex;gap:38px}.stat strong{display:block;color:#265142;font-size:38px;line-height:1.2}.stat span{color:var(--muted);font-size:13px}.page-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 18px}.page-head h1{font-size:30px;letter-spacing:-.6px;margin:2px 0 0}.page-head p{margin:4px 0 0;color:var(--muted)}.count{color:var(--muted)}.card,.panel,.banner-tip{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.banner-tip{margin:18px 0 34px;padding:17px 22px;display:flex;align-items:center;gap:14px}.tip-icon{height:42px;width:42px;border-radius:15px;background:#faeee8;color:var(--orange);display:grid;place-items:center;font-size:20px}.banner-tip strong{display:block}.banner-tip span{color:var(--muted);font-size:13px}.section-title{margin:32px 0 15px}.section-title h2{font-size:27px;margin:2px 0}.toolbar{display:grid;grid-template-columns:1fr 170px auto;gap:12px;margin:16px 0}.field,.select,.textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px 16px;outline:none;color:var(--ink);transition:border-color .2s,box-shadow .2s}.field:focus,.select:focus,.textarea:focus{border-color:#8aa395;box-shadow:0 0 0 4px #dfe9e2}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 19px}.chip{border:1px solid transparent;border-radius:999px;background:#ecefe9;padding:9px 15px;color:#65736b;transition:.2s}.chip:hover{border-color:#c5d1c8}.chip.active{background:var(--green);color:white}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:10px 0 17px}.filter{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 13px;color:#65736b}.filter.active{color:white;background:var(--green);border-color:var(--green)}.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.activity-list{display:grid;gap:14px}.activity{padding:20px 22px;transition:transform .2s,box-shadow .2s;cursor:pointer}.activity:hover{transform:translateY(-2px);box-shadow:0 16px 36px #253d3017}.activity-top{display:flex;justify-content:space-between;align-items:center}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#edf1ec;color:#60796c;padding:4px 10px;border-radius:999px;font-size:12px}.tag.orange{background:#faeee8;color:#b76445}.icon-button{border:0;background:transparent;color:#74877d;font-size:22px}.activity h3{font-size:19px;margin:20px 0 6px}.activity p{margin:0;color:var(--muted);font-size:14px}.activity-foot{border-top:1px solid #eeece5;margin-top:19px;padding-top:12px;display:flex;justify-content:space-between;color:#738178;font-size:13px}.side-card{padding:20px;margin-bottom:14px}.side-card h3{margin:4px 0 10px}.side-card p{margin:0;color:var(--muted);font-size:14px}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.empty .symbol{font-size:34px;color:#91a097}.panel{padding:24px}.panel h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-row{margin:14px 0}.form-row label{display:block;font-weight:600;margin-bottom:7px}.textarea{min-height:125px;resize:vertical}.form-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--muted);font-size:13px}.secondary,.danger{border:1px solid var(--line);border-radius:999px;background:transparent;padding:10px 16px;color:var(--ink)}.danger{color:#a44e3b;border-color:#ecd4ca}.blocked-row,.history-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid var(--line)}.blocked-row:last-child,.history-row:last-child{border:0}.avatar{width:42px;height:42px;border-radius:15px;background:#e8eee9;color:var(--green);display:grid;place-items:center;font-weight:700}.person{display:flex;align-items:center;gap:12px}.person small,.history-row small{display:block;color:var(--muted)}.chat{display:flex;flex-direction:column;gap:12px;max-height:330px;overflow:auto;margin:18px 0;padding:4px}.bubble{max-width:78%;padding:13px 16px;border-radius:18px;background:#eef1ec;align-self:flex-start}.bubble.mine{background:#e1eee5;align-self:flex-end}.bubble small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.success{display:none;background:#e8f2e9;border:1px solid #d3e4d6;color:#365e43;border-radius:16px;padding:14px;margin:14px 0}.success.show{display:block}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{padding:20px}.feature b{display:block;margin:10px 0 5px}.feature p{color:var(--muted);margin:0;font-size:14px}.footer{border-top:1px solid var(--line);padding:22px 0;color:#8a928d;font-size:12px;margin-top:44px;display:flex;justify-content:space-between}.modal-backdrop{position:fixed;inset:0;background:#14231e55;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:28px;padding:26px;box-shadow:0 24px 80px #14231e40;animation:pop .22s ease}@keyframes pop{from{opacity:.5;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:15px}.modal-head h2{margin:0}.close{border:0;background:#eff1ed;border-radius:50%;width:36px;height:36px;font-size:20px}.modal p{color:#66756c}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#263e34;color:white;border-radius:999px;padding:11px 19px;z-index:20;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.header-inner{flex-wrap:wrap;gap:8px}.brand{min-width:0;flex:1}.nav{order:3;flex-basis:100%;overflow:auto;justify-content:flex-start}.hero{padding:30px;grid-template-columns:1fr}.hero-side{justify-self:start}.hero:after{right:-170px}.content-grid{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:0 15px;margin-top:16px}.header-inner{padding:10px 15px}.publish-top{padding:10px 14px}.hero{border-radius:26px;padding:25px 22px;min-height:0}.hero h1{font-size:36px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .field{grid-column:1/-1}.page-head h1{font-size:26px}.activity{padding:17px}.activity h3{font-size:17px}.form-grid,.feature-grid{grid-template-columns:1fr}.banner-tip{align-items:flex-start;padding:15px}.form-foot{align-items:flex-start;flex-direction:column}.brand strong{font-size:14px}.brand small{font-size:9px}}
  </style>
</head>
<body>
  <div class="demo-banner">功能预览 · 页面数据均为模拟内容 · 发布、反馈与屏蔽操作不会提交到服务器</div>
  <header class="header"><div class="header-inner">
    <div class="brand"><div class="brand-icon">校</div><div><strong>校园活动与机会</strong><small>STUDENT OPPORTUNITIES</small></div></div>
    <nav class="nav" id="nav"></nav><button class="publish-top" data-page="publish">＋ 发布</button>
  </div></header>
  <main id="main"></main>
  <div class="modal-backdrop" id="modal"><div class="modal" id="modal-content"></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const cats=['竞赛训练','讲座分享','项目招募','志愿服务','学习小组','学习资料','运动社交','兴趣交流','学生发布'];
    const items=[
      {id:1,title:'“蓝桥杯”程序设计校内训练营',category:'竞赛训练',source:'校内信息',signal:'补充通知',date:'9 月 21 日 19:30',body:'9 月 24 日 22:00 报名截止；首场训练安排在实验楼 A402；面向全校学生，零基础可参加。',detail:'这是一个模拟活动。补充通知将首次训练时间调整为 9 月 21 日 19:30，地点为实验楼 A402；报名截止时间保持不变。'},
      {id:2,title:'AI 应用入门公开课',category:'讲座分享',source:'计算机学院',signal:'信息完整',date:'9 月 19 日 19:00',body:'计算机学院教学楼；面向全校学生；无需报名；预计 90 分钟。',detail:'学院发布的模拟讲座信息。可查看来源、活动时间和参与说明。'},
      {id:3,title:'大学生创新创业项目团队招募',category:'项目招募',source:'校内信息',signal:'补充说明',date:'报名截止 9 月 22 日',body:'每周需稳定投入 4 小时以上；需提交简短自我介绍。',detail:'补充说明：开发方向名额已满，现主要补充设计与材料成员。'},
      {id:4,title:'Web 开发零基础学习小组',category:'学习小组',source:'校内信息',signal:'信息缺失',date:'9 月 23 日起每周三',body:'面向零基础学生，限 30 人；报名时间未注明，满员即止。',detail:'注意：报名时间未注明，建议报名之前进一步确认。'},
      {id:5,title:'校园公益志愿服务活动',category:'志愿服务',source:'校内信息',signal:'待核实',date:'活动时间 9 月 27 日',body:'预计服务 8 小时；需提前到场签到；报名截止时间为 9 月 20 日 12:00。',detail:'请留意报名截止时间和活动方后续通知。'},
      {id:6,title:'周末羽毛球约球',category:'运动社交',source:'学生发布',signal:'待核实',date:'9 月 20 日 16:00',body:'计划 6—8 人，费用 AA；场地待最终确认。',detail:'学生个人发布的模拟内容。场地尚待确认，建议先与发起人核实。'},
      {id:7,title:'校园兼职福利分享',category:'学生发布',source:'学生发布',signal:'风险线索',date:'时间地点未提供',body:'未提供主办方、地点和完整内容；要求添加私人联系方式获取详情。',detail:'该信息来源尚未核验。请谨慎提供个人信息，并先确认发布方身份。'}
    ];
    const pages=[['discover','发现活动'],['saved','我的收藏'],['mine','我的发布'],['verify','待核实'],['blocked','已屏蔽'],['feedback','反馈管理']];
    let page=location.hash.slice(1)||'discover',query='',category='全部',signal='全部线索',source='全部来源';
    let saved=new Set([2]),blocked=new Set(['校园兼职福利分享']),mine=[{title:'校园读书交流小组',status:'审核中',date:'今天 10:28'}],sent=[];
    const nav=document.querySelector('#nav'),main=document.querySelector('#main');
    function go(p){page=p;location.hash=p;render()}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function badge(s){return `<span class="tag ${/风险|待核实|补充/.test(s)?'orange':''}">${esc(s)}</span>`}
    function filtered(){return items.filter(x=>(page==='saved'?saved.has(x.id):page==='blocked'?blocked.has(x.title):true)&&(!query||`${x.title}${x.body}${x.category}`.toLowerCase().includes(query.toLowerCase()))&&(category==='全部'||x.category===category)&&(signal==='全部线索'||signal===x.signal)&&(source==='全部来源'||source===x.source))}
    function cards(list){if(!list.length)return '<div class="card empty"><div class="symbol">⌕</div><strong>暂时没有匹配的信息</strong><p>试试调整搜索词或筛选条件。</p></div>';return `<div class="activity-list">${list.map(x=>`<article class="card activity" data-detail="${x.id}"><div class="activity-top"><div class="tags">${badge(x.source)}${badge(x.category)}${badge(x.signal)}</div><button class="icon-button" data-save="${x.id}" title="收藏">${saved.has(x.id)?'♥':'♡'}</button></div><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="activity-foot"><span>${esc(x.date)}</span><span>查看详情　↗</span></div></article>`).join('')}</div>`}
    function discover(){return `<section class="hero"><div><div class="eyebrow">CAMPUS LIFE · FALL 2026</div><h1>校园里的好机会，<br><span>值得被看见。</span></h1><p>活动、学习小组、项目招募和同学发起的邀约，放在一起看清楚。</p></div><div class="hero-side"><div class="stat-row"><div class="stat"><strong>7</strong><span>条模拟活动与机会</span></div><div class="stat"><strong>6</strong><span>条待留意线索</span></div></div></div></section><div class="banner-tip"><div class="tip-icon">↻</div><div><strong>跟进补充通知，别错过关键信息更新</strong><span>活动内容会标记补充通知、信息缺失和待核实线索，帮助你快速找到需要留意的地方。</span></div></div><div class="page-head"><div><div class="eyebrow">BROWSE THE BOARD</div><h1>发现适合你的机会</h1></div><div class="count">${filtered().length} 条结果</div></div>${toolbar()}<div class="content-grid"><div>${categoryChips()}${signalChips()}${cards(filtered())}</div><aside><div class="card side-card" style="background:#e8eee9"><div class="eyebrow">新生小提示</div><h3>先看时间，再看条件。</h3><p>有些活动需要提前预约，有些名额有限。点开卡片，查看原始信息和仍待确认的细节。</p></div><div class="card side-card"><div class="eyebrow">信息来源</div><p>校内信息 · 学院发布 · 学生个人发布</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><p>所有活动内容均为演示模拟数据，不代表真实校园通知。</p></div></aside></div>`}
    function toolbar(){return `<div class="toolbar"><input class="field" id="search" placeholder="⌕　搜活动、技能或关键词" value="${esc(query)}"><select class="select" id="source"><option>全部来源</option>${['校内信息','计算机学院','学生发布'].map(s=>`<option ${source===s?'selected':''}>${s}</option>`).join('')}</select><span class="count" style="align-self:center">模拟数据</span></div>`}
    function categoryChips(){return `<div class="chips">${['全部',...cats].map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>`}
    function signalChips(){return `<div class="filters">信息线索 ${['全部线索','补充通知','信息冲突','信息缺失','待核实','风险线索'].map(s=>`<button class="filter ${signal===s?'active':''}" data-signal="${s}">${s}</button>`).join('')}</div>`}
    function head(title,sub,count=''){return `<div class="page-head"><div><div class="eyebrow">STUDENT OPPORTUNITIES</div><h1>${title}</h1><p>${sub}</p></div>${count?`<div class="count">${count}</div>`:''}</div>`}
    function pageContent(){if(page==='discover')return discover();if(page==='saved')return `${head('我的收藏','收藏感兴趣的活动，稍后再看。',`${saved.size} 条`)}${toolbar()}${cards(filtered())}`;
      if(page==='verify')return `${head('待核实信息','集中查看仍需进一步确认的活动线索。','3 条线索')}${signalChips()}${cards(items.filter(x=>['待核实','信息缺失','风险线索','补充通知'].includes(x.signal)&&(signal==='全部线索'||signal===x.signal)))}`;
      if(page==='mine')return `${head('我的发布','查看本地演示中的发布与审核状态。',`${mine.length} 条`)}<div class="card panel"><div class="eyebrow">发布记录</div>${mine.length?mine.map(x=>`<div class="history-row"><div><b>${esc(x.title)}</b><small>${x.date} · 内容仅在本次演示中</small></div>${badge(x.status)}</div>`).join(''):'暂无发布记录'}</div><div class="banner-tip"><div class="tip-icon">i</div><div><strong>审核流程预览</strong><span>真实版本可由审核员检查内容，通过后公开展示；当前演示不连接审核服务器。</span></div></div>`;
      if(page==='blocked')return `${head('已屏蔽','查看已屏蔽的信息发布者，并可随时撤销。','历史记录') }<div class="card panel">${[...blocked].map((x,i)=>`<div class="blocked-row"><div class="person"><div class="avatar">${x[0]}</div><div><b>${esc(x)}</b><small>屏蔽时间：${i?'昨天':'今天'} · 该发布者的信息已隐藏</small></div></div><button class="secondary" data-unblock="${esc(x)}">撤销屏蔽</button></div>`).join('')||'<div class="empty">还没有屏蔽记录</div>'}</div>`;
      if(page==='feedback')return `${head('反馈管理','直接向开发者发送建议，帮助产品变得更好。')}<div class="content-grid"><section class="card panel"><div class="eyebrow">联系开发者</div><h2>你的想法，我们认真听。</h2><p style="color:var(--muted)">留下使用体验、问题或改进建议。此处为本地演示，不会真的发送消息。</p><div class="chat" id="chat">${sent.map(m=>`<div class="bubble mine">${esc(m)}<small>刚刚 · 演示消息</small></div>`).join('')}<div class="bubble">你好！欢迎告诉我们你对校园活动与机会的想法。<small>开发者 · 演示对话</small></div></div><form id="feedback-form"><textarea class="textarea" id="feedback-text" placeholder="写下你的建议或遇到的问题…" required></textarea><div class="form-foot"><span>你的每一条反馈都能帮助产品进步。</span><button class="primary">发送反馈</button></div></form><div class="success" id="thanks">感谢你的认真反馈！每一条建议都让产品离理想更近一步。若开发者采纳建议，正式版本可在这里告知你。</div></section><aside class="card side-card"><div class="eyebrow">反馈之后</div><h3>被看见，也被感谢。</h3><p>正式产品可由开发者回复建议状态，例如“已采纳”，让每次参与都有回应。</p><div class="banner-tip" style="padding:12px;margin-top:15px"><div class="tip-icon">♡</div><div><strong>谢谢你让它更好</strong><span>你的建议值得被认真对待。</span></div></div></aside></div>`;
      if(page==='publish')return `${head('发布信息','填写活动内容，预览发布审核的使用流程。')}<section class="card panel"><div class="eyebrow">发布新机会 · 演示表单</div><h2>分享一个值得参与的活动</h2><form id="publish-form"><div class="form-grid"><div class="form-row"><label>活动标题</label><input class="field" name="title" placeholder="例如：校园编程交流会" required></div><div class="form-row"><label>活动类型</label><select class="select" name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-row"><label>活动时间</label><input class="field" name="date" placeholder="例如：10 月 12 日 14:00"></div><div class="form-row"><label>活动地点</label><input class="field" name="place" placeholder="填写具体地点或线上方式"></div></div><div class="form-row"><label>活动说明</label><textarea class="textarea" name="body" placeholder="介绍活动内容、参与条件及注意事项…" required></textarea></div><div class="banner-tip"><div class="tip-icon">✓</div><div><strong>发布后先进入审核</strong><span>通过审核的内容才会公开展示。当前表单仅保存在页面状态，不会上传文件或写入服务器。</span></div></div><div class="form-foot"><a href="#mine" data-page="mine" style="color:var(--green)">查看我的发布记录</a><button class="primary">提交审核（演示）</button></div></form><div class="success" id="publish-success">提交成功！这是一条模拟记录，已加入“我的发布”，状态为“审核中”。</div></section>`;
      return head('页面未找到','选择顶部导航继续浏览。')}
    function render(){nav.innerHTML=pages.map(([p,t])=>`<button class="${page===p?'active':''}" data-page="${p}">${t}${p==='saved'&&saved.size?` ${saved.size}`:''}</button>`).join('');main.innerHTML=`<div class="demo-note"><b>考核演示站：</b>当前看到的是可交互的功能预览。活动数据为模拟内容，所有操作仅在当前浏览器中演示。</div>${pageContent()}<footer class="footer"><span>校园活动与机会 · 功能预览</span><span>模拟数据，仅用于展示产品交互</span></footer>`;bind()}
    function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.page)});const search=document.querySelector('#search');if(search)search.oninput=()=>{query=search.value;refreshCards()};const src=document.querySelector('#source');if(src)src.onchange=()=>{source=src.value;render()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});document.querySelectorAll('[data-signal]').forEach(b=>b.onclick=()=>{signal=b.dataset.signal;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=Number(b.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);render();toast(saved.has(id)?'已加入我的收藏':'已取消收藏')});document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-save]'))return;showDetail(Number(el.dataset.detail))});document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>{blocked.delete(b.dataset.unblock);render();toast('已撤销屏蔽')});const pf=document.querySelector('#publish-form');if(pf)pf.onsubmit=e=>{e.preventDefault();const d=new FormData(pf);mine.unshift({title:d.get('title'),status:'审核中',date:'刚刚'});document.querySelector('#publish-success').classList.add('show');toast('演示提交成功：等待审核');};const ff=document.querySelector('#feedback-form');if(ff)ff.onsubmit=e=>{e.preventDefault();const tx=document.querySelector('#feedback-text');sent.push(tx.value);render();document.querySelector('#thanks').classList.add('show');document.querySelector('#chat').scrollTop=0;toast('感谢你的反馈！（演示）')};document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}}
    function refreshCards(){const found=document.querySelector('.content-grid>div');if(!found)return;const box=found.querySelector('.activity-list,.card.empty');if(box)box.outerHTML=cards(filtered());const count=document.querySelector('.page-head .count');if(count)count.textContent=`${filtered().length} 条结果`;bindDetailsOnly()}
    function bindDetailsOnly(){document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-save]'))return;showDetail(Number(el.dataset.detail))});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=Number(b.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);render();toast(saved.has(id)?'已加入我的收藏':'已取消收藏')})}
    function showDetail(id){const x=items.find(a=>a.id===id);if(!x)return;document.querySelector('#modal-content').innerHTML=`<div class="modal-head"><div class="tags">${badge(x.source)}${badge(x.category)}${badge(x.signal)}</div><button class="close" onclick="closeModal()">×</button></div><h2 style="margin:17px 0 5px">${esc(x.title)}</h2><p>${esc(x.detail)}</p><div class="history-row"><span>活动时间</span><b>${esc(x.date)}</b></div><div class="history-row"><span>信息来源</span><b>${esc(x.source)} · 模拟内容</b></div><p>${esc(x.body)}</p><div class="form-foot"><button class="secondary" onclick="toggleSave(${x.id})">${saved.has(x.id)?'取消收藏':'♡ 收藏'}</button><div><button class="secondary" onclick="blockItem(${x.id})">屏蔽发布者</button> <button class="danger" onclick="toast('举报已记录（本地演示）');closeModal()">举报信息</button></div></div>`;document.querySelector('#modal').classList.add('open')}
    function closeModal(){document.querySelector('#modal').classList.remove('open')};function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);closeModal();render();toast(saved.has(id)?'已收藏':'已取消收藏')};function blockItem(id){const x=items.find(a=>a.id===id);blocked.add(x.title);closeModal();render();toast('已屏蔽该发布者（演示）')}
    window.closeModal=closeModal;window.toggleSave=toggleSave;window.blockItem=blockItem;window.toast=toast;window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'discover';render()});render();
  </script>
</body>
</html>
